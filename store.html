<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidra Perfume</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#FBF7EE;--card:#fff;--ink:#2b2418;--gold:#B08D3C;--line:#E7DDC6}
@media(prefers-color-scheme:dark){:root{--bg:#1c1912;--card:#26221a;--ink:#f2ead7;--line:#3b3526}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--gold);color:#fff;padding:14px 16px;text-align:center;font-weight:800;font-size:20px}main{padding:10px 14px 90px;max-width:720px;margin:auto}
.ch{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}.b.on,.b.p{background:var(--gold);color:#fff;border-color:var(--gold)}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);margin:4px 0;font:inherit}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.m{color:var(--gold);font-weight:700}small{opacity:.7}.bad{color:#B42318}
#bar{position:fixed;bottom:0;inset-inline:0;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
</style></head><body><header>🌳 Sidra Perfume</header><main id="app"></main><div id="bar" hidden></div>
<script>
const SB_URL='PASTE_PROJECT_URL',SB_KEY='PASTE_PUBLISHABLE_KEY',WA='20XXXXXXXXXX'; /* WA: رقم واتساب المحل بالصيغة الدولية بدون + */
const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),V=id=>($('#'+id)||{}).value||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={rows:null,cat:'',cart:[],view:'shop',msg:'',done:null};
async function load(){const r=await sb.from('sp_catalog').select('*').order('name').order('ml');S.rows=r.error?[]:r.data;draw()}
const find=id=>S.rows.find(x=>x.size_id==id),total=()=>S.cart.reduce((s,c)=>s+find(c.id).price*c.qty,0);
function draw(){const a=$('#app'),bar=$('#bar');bar.hidden=!S.cart.length||S.view!=='shop';
 if(S.rows===null){a.innerHTML='<p>جاري التحميل…</p>';return}
 if(S.done){a.innerHTML=`<div class=c><h3>✓ وصلنا طلبك رقم ${S.done.id}</h3><p>هنكلّمك لتأكيد الطلب والتوصيل.</p><a class="b p" target=_blank rel=noopener href="https://wa.me/${WA}?text=${encodeURIComponent(S.done.text)}">أكّد على واتساب</a></div>`;bar.hidden=true;return}
 if(S.view==='cart'){a.innerHTML=cart();return}
 const cats=[...new Set(S.rows.map(r=>r.category).filter(Boolean))],ps=[...new Map(S.rows.filter(r=>!S.cat||r.category===S.cat).map(r=>[r.perfume_id,r])).values()];
 a.innerHTML=`<div class=ch><button class="b ${S.cat?'':'on'}" data-a="c:">الكل</button>${cats.map(c=>`<button class="b ${S.cat===c?'on':''}" data-a="c:${esc(c)}">${esc(c)}</button>`).join('')}</div>`+
 (ps.map(p=>{const z=S.rows.filter(x=>x.perfume_id===p.perfume_id);return `<div class=c><b>${esc(p.name)}</b> <small>${esc(p.category||'')}</small>${p.notes?`<br><small>${esc(p.notes)}</small>`:''}
  ${z.map(x=>`<div class=r><span>${x.ml} مل · <span class=m>${x.price} جنيه</span></span>${x.in_stock?`<button class=b data-a="add:${x.size_id}">+ أضف</button>`:'<small class=bad>غير متاح</small>'}</div>`).join('')}</div>`}).join('')||'<p>الكتالوج فاضي دلوقتي.</p>');
 bar.innerHTML=`<button class="b p" style="width:100%" data-a="v:cart">السلة (${S.cart.reduce((s,c)=>s+c.qty,0)}) · ${total()} جنيه</button>`}
function cart(){return `<button class=b data-a="v:shop">← كمّل تسوّق</button><div class=c>${S.cart.map((c,i)=>{const z=find(c.id);return `<div class=r><span>${esc(z.name)} ${z.ml}مل</span><span><button class=b data-a="q:${i}:-1">−</button> ${c.qty} <button class=b data-a="q:${i}:1">+</button></span><b>${z.price*c.qty}</b></div>`}).join('')}<div class=r><b>الإجمالي</b><b class=m>${total()} جنيه</b></div></div>
 <div class=c><input id=n placeholder="الاسم"><input id=p type=tel inputmode=tel placeholder="رقم التليفون"><textarea id=a rows=2 placeholder="العنوان"></textarea><input id=t placeholder="ملاحظات (اختياري)"><small>الدفع كاش عند الاستلام أو تحويل بعد تأكيدنا.</small><button class="b p" style="width:100%;margin-top:8px" data-a=send>إرسال الطلب</button><p class=bad>${esc(S.msg)}</p></div>`}
async function act(k,v,w){
 if(k==='c'){S.cat=v;return draw()}if(k==='v'){S.view=v;S.msg='';return draw()}
 if(k==='add'){const c=S.cart.find(x=>x.id==v);c?c.qty=Math.min(10,c.qty+1):S.cart.push({id:+v,qty:1});return draw()}
 if(k==='q'){const c=S.cart[+v];c.qty=Math.min(10,c.qty+ +w);if(c.qty<1)S.cart.splice(+v,1);if(!S.cart.length)S.view='shop';return draw()}
 if(k==='send'){const r=await sb.rpc('sp_place_order',{p_name:V('n'),p_phone:V('p'),p_address:V('a'),p_note:V('t'),p_items:S.cart.map(c=>({size_id:c.id,qty:c.qty}))});
  if(r.error){S.msg=r.error.message;return draw()}
  const txt='طلب جديد #'+r.data+'\n'+S.cart.map(c=>{const z=find(c.id);return z.name+' '+z.ml+'مل ×'+c.qty}).join('\n')+'\nالإجمالي: '+total()+' جنيه\nالاسم: '+V('n')+'\nالتليفون: '+V('p');
  S.done={id:r.data,text:txt};S.cart=[];draw()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){const [k,v,w]=b.dataset.a.split(':');act(k,v,w)}});
load();
</script></body></html>
